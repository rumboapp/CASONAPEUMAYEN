<style>
  :root{
    --madera-1:#6b4226; --madera-2:#8a5a35; --madera-3:#a9713f;
    --papel:#f6efe1; --papel-oscuro:#e8dcc0;
    --tinta:#3b2c1f; --tinta-suave:#6b5c48;
    --acento:#7c9070; --acento-oscuro:#5a6e50;
    --alerta:#a63d3d; --aviso:#c98a2c; --info:#3d6f9e;
    --sombra: 0 3px 6px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Georgia','Times New Roman',serif;
    color:var(--tinta);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 22px),
      linear-gradient(180deg, var(--madera-2), var(--madera-1));
    min-height:100%;
  }
  button{font-family:inherit;}
  .oculto{display:none !important;}

  /* ---------- Botones de madera/cuero ---------- */
  .btn{
    border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:bold;
    color:#fff8ec; cursor:pointer; letter-spacing:.3px;
    background:linear-gradient(180deg, var(--madera-3), var(--madera-1));
    box-shadow: var(--sombra), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .05s ease;
  }
  .btn:active{ transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,.3), inset 0 1px 3px rgba(0,0,0,.4); }
  .btn.secundario{ background:linear-gradient(180deg,#8a9a80,#5a6e50); }
  .btn.peligro{ background:linear-gradient(180deg,#c25a5a,#8a3a3a); }
  .btn.pequeno{ padding:5px 10px; font-size:12px; border-radius:6px; }

  /* ---------- Login ---------- */
  #vista-login{ height:100vh; display:flex; align-items:center; justify-content:center; }
  .placa{
    background: linear-gradient(160deg, var(--papel), var(--papel-oscuro));
    border-radius:14px; padding:36px 40px; width:320px;
    box-shadow: var(--sombra), inset 0 0 0 6px rgba(139,90,53,.25);
    border: 2px solid rgba(107,66,38,.4);
  }
  .placa h1{ margin:0 0 4px; font-size:22px; text-align:center; color:var(--madera-1); text-shadow:0 1px 0 rgba(255,255,255,.5);}
  .placa .sub{ text-align:center; color:var(--tinta-suave); font-size:12px; margin-bottom:20px;}
  .campo{ margin-bottom:14px; }
  .campo label{ display:block; font-size:12px; color:var(--tinta-suave); margin-bottom:4px; }
  .campo input, .campo select, .campo textarea{
    width:100%; padding:9px 10px; border-radius:6px; border:1px solid #c9b896;
    background:#fffdf8; font-family:inherit; font-size:14px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.15);
  }
  .error{ color:var(--alerta); font-size:12px; margin-top:8px; }

  /* ---------- App shell ---------- */
  #vista-app{ display:flex; flex-direction:column; height:100vh; }
  header.encabezado{
    background:linear-gradient(180deg, var(--madera-1), #4a2d18);
    color:#f6efe1; padding:12px 20px; display:flex; align-items:center; justify-content:space-between;
    box-shadow: var(--sombra); z-index:5;
  }
  header.encabezado h1{ margin:0; font-size:18px; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  header.encabezado .usuario{ font-size:12px; opacity:.85; }
  nav.tabs{ display:flex; gap:6px; padding:10px 16px; background:var(--papel-oscuro); box-shadow: inset 0 2px 4px rgba(0,0,0,.15); flex-wrap:wrap;}
  nav.tabs button{
    border:1px solid rgba(107,66,38,.35); background:var(--papel); color:var(--tinta);
    padding:8px 14px; border-radius:8px 8px 0 0; cursor:pointer; font-size:13px; font-weight:bold;
    box-shadow: 0 2px 3px rgba(0,0,0,.12);
  }
  nav.tabs button.activo{ background:var(--acento); color:#fff; box-shadow: var(--sombra); }
  main.contenido{ flex:1; overflow:auto; padding:18px; background: var(--papel); }

  /* ---------- Tarjetas tipo ficha ---------- */
  .tarjeta{
    background:#fffdf8; border-radius:10px; padding:16px 18px; margin-bottom:16px;
    box-shadow: var(--sombra); border:1px solid #d8c9a3;
  }
  .tarjeta h2{ margin:0 0 12px; font-size:16px; color:var(--madera-1); border-bottom:2px dashed #d8c9a3; padding-bottom:8px;}

  /* ---------- Calendario ---------- */
  .calendario-barra{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .calendario-barra .rango{ font-weight:bold; color:var(--madera-1); }
  .grid-calendario{ border:1px solid #d8c9a3; border-radius:8px; overflow:hidden; box-shadow: var(--sombra); background:#fffdf8;}
  .fila-cab{ display:grid; grid-template-columns: 210px repeat(7, 1fr); background:var(--madera-1); color:#fff; }
  .fila-cab > div{ padding:8px 6px; font-size:12px; text-align:center; border-left:1px solid rgba(255,255,255,.15);}
  .fila-unidad{ display:grid; grid-template-columns: 210px repeat(7, 1fr); border-top:1px solid #e6dcc4; position:relative; min-height:46px;}
  .fila-unidad.sub{ background:#faf5e8; }
  .nombre-unidad{ padding:8px; font-size:12.5px; display:flex; align-items:center; border-right:2px solid #d8c9a3; background:var(--papel-oscuro);}
  .celdas{ position:relative; display:grid; grid-template-columns: repeat(7,1fr); }
  .celda-dia{ border-left:1px dashed #e6dcc4; cursor:pointer; }
  .celda-dia:hover{ background: rgba(124,144,112,.15); }
  .barra-reserva{
    position:absolute; top:4px; height:calc(100% - 8px); border-radius:6px; padding:4px 8px;
    font-size:11px; color:#fff; cursor:grab; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    box-shadow: var(--sombra); border:1px solid rgba(0,0,0,.2);
  }
  .barra-reserva.confirmada{ background:linear-gradient(180deg, var(--acento), var(--acento-oscuro)); }
  .barra-reserva.tentativa{ background:linear-gradient(180deg, var(--aviso), #9a6a1e); }
  .barra-reserva.no_show{ background:linear-gradient(180deg, #999, #666); }
  .barra-reserva:active{ cursor:grabbing; }

  /* ---------- Housekeeping ---------- */
  .grid-hk{ display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .ficha-hk{ background:#fffdf8; border-radius:10px; padding:14px; box-shadow: var(--sombra); border:1px solid #d8c9a3; }
  .badge{ display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:bold; color:#fff;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.3), 0 1px 2px rgba(0,0,0,.3);}
  .badge.sucia{ background:var(--alerta); }
  .badge.limpia{ background:var(--acento); }
  .badge.inspeccionada{ background:var(--info); }
  .badge.fuera_servicio{ background:#555; }

  /* ---------- Listas llegadas/salidas/addons ---------- */
  table.lista{ width:100%; border-collapse:collapse; }
  table.lista th, table.lista td{ padding:8px 10px; border-bottom:1px solid #e6dcc4; font-size:13px; text-align:left; }
  table.lista th{ color:var(--madera-1); }

  /* ---------- Modal ---------- */
  .fondo-modal{ position:fixed; inset:0; background:rgba(30,20,10,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal{ background:var(--papel); border-radius:12px; padding:22px 26px; width:min(520px,92vw); max-height:88vh; overflow:auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); border:2px solid rgba(107,66,38,.35); }
  .modal h2{ margin-top:0; color:var(--madera-1); }
  .fila2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .acciones-modal{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

  /* ---------- Firma ---------- */
  #lienzo-firma{ border:2px dashed #b7a37c; border-radius:8px; background:#fffef9; touch-action:none; width:100%; height:150px; }

  .lista-check{ display:flex; align-items:center; gap:8px; font-size:13px; margin-top:8px;}
</style>
