<script>
  // ============================= Estado global =============================
  var SESION = null;
  var UNIDADES_CACHE = [];
  var RESERVAS_CACHE = [];
  var semanaInicio = inicioDeSemana(new Date());
  var contextoModalReserva = null; // {modo:'nueva'|'editar', idUnidad, idCama, etiqueta, tipo, fecha, reserva}
  var dibujandoFirma = false, ctxFirma = null;

  var TABS = [
    { id: 'calendario', label: 'Calendario', roles: ['admin', 'recepcion'] },
    { id: 'checkin', label: 'Check-in', roles: ['admin', 'recepcion'] },
    { id: 'housekeeping', label: 'Aseo', roles: ['admin', 'recepcion', 'aseo'] },
    { id: 'llegadas', label: 'Llegadas / Salidas', roles: ['admin', 'recepcion'] },
    { id: 'addons', label: 'Glamping', roles: ['admin', 'recepcion'] },
    { id: 'usuarios', label: 'Usuarios', roles: ['admin'] }
  ];

  // ============================= Utilidades =============================
  function $(id) { return document.getElementById(id); }
  function val(id) { return $(id).value; }
  function mostrar(id) { $(id).classList.remove('oculto'); }
  function ocultar(id) { $(id).classList.add('oculto'); }
  function setError(id, msg) { $(id).textContent = msg || ''; msg ? mostrar(id) : ocultar(id); }
  function fmtFecha(d) { // yyyy-mm-dd
    var x = (d instanceof Date) ? d : new Date(d);
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  }
  function fmtCorto(d) {
    var x = (d instanceof Date) ? d : new Date(d);
    return x.toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function sumarDias(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function inicioDeSemana(d) { var x = new Date(d); var dia = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dia); x.setHours(0, 0, 0, 0); return x; }
  function diffDias(a, b) { return Math.round((new Date(a) - new Date(b)) / 86400000); }

  // ============================= Sesión / login =============================
  window.addEventListener('load', function () {
    try {
      var guardada = JSON.parse(localStorage.getItem('cp_sesion') || 'null');
      if (guardada && guardada.token) { SESION = guardada; iniciarApp(); }
    } catch (e) { /* sin sesión previa */ }
    configurarFirma();
  });

  $('form-login').addEventListener('submit', function (e) {
    e.preventDefault();
    setError('login-error', '');
    google.script.run
      .withSuccessHandler(function (res) {
        SESION = res;
        localStorage.setItem('cp_sesion', JSON.stringify(res));
        iniciarApp();
      })
      .withFailureHandler(function (err) { setError('login-error', err.message || String(err)); })
      .login(val('login-nombre'), val('login-pin'));
  });

  $('btn-logout').addEventListener('click', function () {
    google.script.run.logout(SESION.token);
    localStorage.removeItem('cp_sesion');
    location.reload();
  });

  function iniciarApp() {
    ocultar('vista-login');
    mostrar('vista-app');
    $('etiqueta-usuario').textContent = SESION.nombre + ' · ' + etiquetaRol(SESION.rol);
    construirTabs();
    google.script.run.withSuccessHandler(function (u) { UNIDADES_CACHE = u; }).listarUnidades(SESION.token);
    var primera = TABS.filter(function (t) { return t.roles.indexOf(SESION.rol) > -1; })[0];
    cambiarVista(primera.id);
  }

  function etiquetaRol(r) { return { admin: 'Administración', recepcion: 'Recepción', aseo: 'Aseo' }[r] || r; }

  function construirTabs() {
    var cont = $('tabs'); cont.innerHTML = '';
    TABS.filter(function (t) { return t.roles.indexOf(SESION.rol) > -1; }).forEach(function (t) {
      var b = document.createElement('button');
      b.textContent = t.label; b.dataset.tab = t.id;
      b.addEventListener('click', function () { cambiarVista(t.id); });
      cont.appendChild(b);
    });
  }

  function cambiarVista(id) {
    document.querySelectorAll('.vista').forEach(function (v) { v.classList.add('oculto'); });
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('activo', b.dataset.tab === id); });
    mostrar('vista-' + id);
    if (id === 'calendario') cargarCalendario();
    if (id === 'checkin') cargarCheckin();
    if (id === 'housekeeping') cargarHousekeeping();
    if (id === 'llegadas') cargarLlegadas();
    if (id === 'addons') cargarAddons();
    if (id === 'usuarios') cargarUsuarios();
  }

  function manejarError(err) {
    alert(err && err.message ? err.message : String(err));
  }

  // ============================= Calendario =============================
  $('cal-prev').addEventListener('click', function () { semanaInicio = sumarDias(semanaInicio, -7); cargarCalendario(); });
  $('cal-next').addEventListener('click', function () { semanaInicio = sumarDias(semanaInicio, 7); cargarCalendario(); });
  $('cal-hoy').addEventListener('click', function () { semanaInicio = inicioDeSemana(new Date()); cargarCalendario(); });

  function cargarCalendario() {
    var fin = sumarDias(semanaInicio, 7);
    $('cal-rango').textContent = fmtCorto(semanaInicio) + '  →  ' + fmtCorto(sumarDias(fin, -1));
    google.script.run
      .withSuccessHandler(function (reservas) { RESERVAS_CACHE = reservas; pintarCalendario(); })
      .withFailureHandler(manejarError)
      .listarReservas(SESION.token, fmtFecha(semanaInicio), fmtFecha(fin));
  }

  function filasCalendario() {
    // Devuelve filas planas: {rowKey, label, idUnidad, idCama, tipo, esSub}
    var filas = [];
    UNIDADES_CACHE.forEach(function (u) {
      if (u.ventaPorCama && u.camas.length) {
        u.camas.forEach(function (c) {
          filas.push({ rowKey: c.id, label: u.nombre + ' — ' + c.nombre, idUnidad: u.id, idCama: c.id, tipo: u.tipo, esSub: true });
        });
      } else {
        filas.push({ rowKey: u.id, label: u.nombre, idUnidad: u.id, idCama: '', tipo: u.tipo, esSub: false });
      }
    });
    return filas;
  }

  function pintarCalendario() {
    var cont = $('grid-calendario'); cont.innerHTML = '';
    var dias = [];
    for (var i = 0; i < 7; i++) dias.push(sumarDias(semanaInicio, i));

    var cab = document.createElement('div'); cab.className = 'fila-cab';
    cab.appendChild(document.createElement('div')).textContent = 'Unidad';
    dias.forEach(function (d) { var c = document.createElement('div'); c.textContent = fmtCorto(d); cab.appendChild(c); });
    cont.appendChild(cab);

    var filas = filasCalendario();
    filas.forEach(function (f) {
      var fila = document.createElement('div'); fila.className = 'fila-unidad' + (f.esSub ? ' sub' : '');
      var nombre = document.createElement('div'); nombre.className = 'nombre-unidad'; nombre.textContent = f.label;
      fila.appendChild(nombre);

      var celdas = document.createElement('div'); celdas.className = 'celdas';
      dias.forEach(function (d) {
        var c = document.createElement('div'); c.className = 'celda-dia';
        c.dataset.rowkey = f.rowKey; c.dataset.fecha = fmtFecha(d);
        c.addEventListener('click', function () { abrirModalNuevaReserva(f, fmtFecha(d)); });
        c.addEventListener('dragover', function (e) { e.preventDefault(); });
        c.addEventListener('drop', function (e) { e.preventDefault(); manejarDrop(f, fmtFecha(d)); });
        celdas.appendChild(c);
      });
      fila.appendChild(celdas);

      // Barras de reserva de esta fila
      RESERVAS_CACHE.forEach(function (r) {
        r.items.forEach(function (it, idx) {
          var clave = it.idCama || it.idUnidad;
          if (clave !== f.rowKey) return;
          var inicio = new Date(r.checkIn), fin2 = new Date(r.checkOut);
          var visIni = inicio < semanaInicio ? semanaInicio : inicio;
          var visFin = fin2 > sumarDias(semanaInicio, 7) ? sumarDias(semanaInicio, 7) : fin2;
          if (visFin <= semanaInicio || visIni >= sumarDias(semanaInicio, 7)) return;
          var colIni = diffDias(fmtFecha(visIni), fmtFecha(semanaInicio));
          var colFin = diffDias(fmtFecha(visFin), fmtFecha(semanaInicio));
          var barra = document.createElement('div');
          barra.className = 'barra-reserva ' + r.estado;
          barra.style.left = (colIni / 7 * 100) + '%';
          barra.style.width = (Math.max(colFin - colIni, 0.3) / 7 * 100) + '%';
          barra.textContent = r.huespedNombre;
          barra.title = r.huespedNombre + ' · ' + r.checkIn + ' a ' + r.checkOut;
          barra.draggable = true;
          barra.dataset.idreserva = r.id;
          barra.dataset.itemidx = idx;
          barra.addEventListener('dragstart', function (e) {
            e.dataTransfer.setData('text/plain', r.id + '::' + idx);
          });
          barra.addEventListener('click', function (ev) { ev.stopPropagation(); abrirModalEditarReserva(r); });
          celdas.appendChild(barra);
        });
      });

      cont.appendChild(fila);
    });
  }

  var arrastreActual = null;
  document.addEventListener('dragstart', function (e) {
    if (e.target.classList && e.target.classList.contains('barra-reserva')) {
      arrastreActual = { idReserva: e.target.dataset.idreserva, itemIdx: Number(e.target.dataset.itemidx) };
    }
  });

  function manejarDrop(filaDestino, fechaDestino) {
    if (!arrastreActual) return;
    var reserva = RESERVAS_CACHE.filter(function (r) { return r.id === arrastreActual.idReserva; })[0];
    if (!reserva) return;
    var delta = diffDias(fechaDestino, fmtFecha(reserva.checkIn));
    var nuevoCheckIn = fmtFecha(sumarDias(new Date(reserva.checkIn), delta));
    var nuevoCheckOut = fmtFecha(sumarDias(new Date(reserva.checkOut), delta));
    var nuevosItems = reserva.items.map(function (it, idx) {
      if (idx !== arrastreActual.itemIdx) return it;
      return { idUnidad: filaDestino.idUnidad, idCama: filaDestino.idCama, etiqueta: filaDestino.label, precio: it.precio };
    });
    google.script.run
      .withSuccessHandler(function () { arrastreActual = null; cargarCalendario(); })
      .withFailureHandler(function (err) { arrastreActual = null; manejarError(err); cargarCalendario(); })
      .moverReserva(SESION.token, reserva.id, nuevoCheckIn, nuevoCheckOut, nuevosItems);
  }

  // ============================= Modal reserva =============================
  function abrirModalNuevaReserva(fila, fecha) {
    contextoModalReserva = { modo: 'nueva', fila: fila };
    $('modal-reserva-titulo').textContent = 'Nueva reserva — ' + fila.label;
    $('form-reserva').reset();
    setError('reserva-error', '');
    $('res-unidad-fija').textContent = fila.label;
    $('res-checkin').value = fecha;
    $('res-checkout').value = fmtFecha(sumarDias(new Date(fecha), 1));
    ocultar('btn-cancelar-existente');
    if (fila.tipo === 'glamping') { mostrar('res-addon-glamping'); } else { ocultar('res-addon-glamping'); }
    actualizarPrecioSugerido();
    mostrar('modal-reserva');
  }

  function abrirModalEditarReserva(reserva) {
    contextoModalReserva = { modo: 'editar', reserva: reserva };
    $('modal-reserva-titulo').textContent = 'Editar reserva — ' + reserva.huespedNombre;
    setError('reserva-error', '');
    $('res-nombre').value = reserva.huespedNombre;
    $('res-canal').value = reserva.canal;
    $('res-checkin').value = fmtFecha(reserva.checkIn);
    $('res-checkout').value = fmtFecha(reserva.checkOut);
    $('res-unidad-fija').textContent = reserva.items.map(function (it) { return it.etiqueta; }).join(', ');
    $('res-anticipo').value = reserva.anticipo || 0;
    $('res-precio').value = reserva.total || 0;
    $('res-notas').value = reserva.notas || '';
    ocultar('res-addon-glamping');
    mostrar('btn-cancelar-existente');
    mostrar('modal-reserva');
  }

  ['res-checkin', 'res-checkout'].forEach(function (id) { $(id).addEventListener('change', actualizarPrecioSugerido); });
  function actualizarPrecioSugerido() {
    if (!contextoModalReserva || contextoModalReserva.modo !== 'nueva') return;
    var f = contextoModalReserva.fila;
    google.script.run
      .withSuccessHandler(function (p) { $('res-precio').value = p; })
      .precioSugerido(SESION.token, f.idUnidad, f.idCama, val('res-checkin'));
  }

  $('btn-cancelar-reserva').addEventListener('click', function () { ocultar('modal-reserva'); });

  $('btn-cancelar-existente').addEventListener('click', function () {
    if (!confirm('¿Cancelar esta reserva?')) return;
    google.script.run
      .withSuccessHandler(function () { ocultar('modal-reserva'); cargarCalendario(); })
      .withFailureHandler(manejarError)
      .cambiarEstadoReserva(SESION.token, contextoModalReserva.reserva.id, 'cancelada');
  });

  $('form-reserva').addEventListener('submit', function (e) {
    e.preventDefault();
    setError('reserva-error', '');
    var checkIn = val('res-checkin'), checkOut = val('res-checkout');

    if (contextoModalReserva.modo === 'nueva') {
      var fila = contextoModalReserva.fila;
      var payload = {
        huesped: { nombre: val('res-nombre') },
        canal: val('res-canal'),
        checkIn: checkIn, checkOut: checkOut,
        anticipo: Number(val('res-anticipo')) || 0,
        notas: val('res-notas'),
        items: [{ idUnidad: fila.idUnidad, idCama: fila.idCama, etiqueta: fila.label, precio: Number(val('res-precio')) || 0 }]
      };
      google.script.run
        .withSuccessHandler(function (res) {
          if (fila.tipo === 'glamping' && $('res-addon-check').checked) {
            google.script.run.crearAddon(SESION.token, res.id, 'tinaja_sushi', val('res-addon-fecha'), '');
          }
          ocultar('modal-reserva'); cargarCalendario();
        })
        .withFailureHandler(function (err) { setError('reserva-error', err.message || String(err)); })
        .crearReserva(SESION.token, payload);
    } else {
      var reserva = contextoModalReserva.reserva;
      var nuevosItems = reserva.items.map(function (it) { return it; });
      // El total editado se guarda como precio del primer ítem para simplicidad (reservas de 1 ítem son el caso normal).
      if (nuevosItems.length) nuevosItems[0].precio = Number(val('res-precio')) || 0;
      google.script.run
        .withSuccessHandler(function () {
          google.script.run.actualizarNotasReserva(SESION.token, reserva.id, val('res-notas'));
          ocultar('modal-reserva'); cargarCalendario();
        })
        .withFailureHandler(function (err) { setError('reserva-error', err.message || String(err)); })
        .moverReserva(SESION.token, reserva.id, checkIn, checkOut, nuevosItems);
    }
  });

  // ============================= Check-in =============================
  function cargarCheckin() {
    google.script.run
      .withSuccessHandler(function (res) {
        var tbody = $('tabla-llegadas-checkin').querySelector('tbody'); tbody.innerHTML = '';
        res.llegadas.forEach(function (r) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td>' + r.huespedNombre + '</td><td>' + r.canal + '</td><td>' + r.estado + '</td>' +
            '<td><button class="btn pequeno">Check-in</button></td>';
          tr.querySelector('button').addEventListener('click', function () { abrirModalCheckin(r); });
          tbody.appendChild(tr);
        });
      })
      .withFailureHandler(manejarError)
      .llegadasYSalidas(SESION.token, fmtFecha(new Date()));
  }

  var reservaCheckinActual = null;
  function abrirModalCheckin(reserva) {
    reservaCheckinActual = reserva;
    $('form-checkin').reset();
    setError('checkin-error', '');
    $('ck-nombre').value = reserva.huespedNombre;
    limpiarLienzo();
    mostrar('modal-checkin');
  }
  $('btn-cancelar-checkin').addEventListener('click', function () { ocultar('modal-checkin'); });

  $('form-checkin').addEventListener('submit', function (e) {
    e.preventDefault();
    setError('checkin-error', '');
    var datos = {
      nombreCompleto: val('ck-nombre'), documento: val('ck-documento'), nacionalidad: val('ck-nacionalidad'),
      fechaNacimiento: val('ck-nacimiento'), procedencia: val('ck-procedencia'), destino: val('ck-destino'),
      motivoViaje: val('ck-motivo'), contactoEmergencia: val('ck-emergencia'),
      aceptaReglamento: $('ck-reglamento').checked,
      firmaDataUrl: $('lienzo-firma').toDataURL('image/png')
    };
    google.script.run
      .withSuccessHandler(function () { ocultar('modal-checkin'); cargarCheckin(); })
      .withFailureHandler(function (err) { setError('checkin-error', err.message || String(err)); })
      .guardarFicha(SESION.token, reservaCheckinActual.id, datos);
  });

  function configurarFirma() {
    var lienzo = $('lienzo-firma');
    function ajustarTamano() { lienzo.width = lienzo.clientWidth; lienzo.height = lienzo.clientHeight; }
    ajustarTamano();
    window.addEventListener('resize', ajustarTamano);
    ctxFirma = lienzo.getContext('2d');
    ctxFirma.lineWidth = 2; ctxFirma.lineCap = 'round'; ctxFirma.strokeStyle = '#3b2c1f';
    function pos(e) {
      var r = lienzo.getBoundingClientRect();
      var p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    }
    function iniciar(e) { dibujandoFirma = true; var p = pos(e); ctxFirma.beginPath(); ctxFirma.moveTo(p.x, p.y); }
    function mover(e) { if (!dibujandoFirma) return; var p = pos(e); ctxFirma.lineTo(p.x, p.y); ctxFirma.stroke(); e.preventDefault(); }
    function terminar() { dibujandoFirma = false; }
    lienzo.addEventListener('pointerdown', iniciar);
    lienzo.addEventListener('pointermove', mover);
    window.addEventListener('pointerup', terminar);
  }
  function limpiarLienzo() { if (ctxFirma) ctxFirma.clearRect(0, 0, $('lienzo-firma').width, $('lienzo-firma').height); }
  $('btn-limpiar-firma').addEventListener('click', limpiarLienzo);

  // ============================= Housekeeping =============================
  function cargarHousekeeping() {
    google.script.run
      .withSuccessHandler(function (lista) {
        var cont = $('grid-hk'); cont.innerHTML = '';
        lista.forEach(function (u) {
          var div = document.createElement('div'); div.className = 'ficha-hk';
          div.innerHTML =
            '<div style="font-weight:bold;margin-bottom:6px;">' + u.nombre + '</div>' +
            '<span class="badge ' + u.estado + '">' + etiquetaEstado(u.estado) + '</span>' +
            '<div style="font-size:11px;color:var(--tinta-suave);margin-top:8px;">Actualizado por ' + (u.responsable || '—') + '</div>';
          var sel = document.createElement('select');
          ['sucia', 'limpia', 'inspeccionada', 'fuera_servicio'].forEach(function (e) {
            var op = document.createElement('option'); op.value = e; op.textContent = etiquetaEstado(e);
            if (e === u.estado) op.selected = true;
            sel.appendChild(op);
          });
          sel.style.marginTop = '8px'; sel.style.width = '100%';
          sel.addEventListener('change', function () {
            google.script.run.withFailureHandler(manejarError)
              .withSuccessHandler(cargarHousekeeping)
              .actualizarEstadoUnidad(SESION.token, u.idUnidad, sel.value, '');
          });
          div.appendChild(sel);
          cont.appendChild(div);
        });
      })
      .withFailureHandler(manejarError)
      .listarEstadoUnidades(SESION.token);
  }
  function etiquetaEstado(e) {
    return { sucia: 'Sucia', limpia: 'Limpia', inspeccionada: 'Inspeccionada', fuera_servicio: 'Fuera de servicio' }[e] || e;
  }

  // ============================= Llegadas / Salidas =============================
  function cargarLlegadas() {
    google.script.run
      .withSuccessHandler(function (res) {
        var tbl = function (id, arr) {
          var tbody = $(id).querySelector('tbody'); tbody.innerHTML = '';
          arr.forEach(function (r) {
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>' + r.huespedNombre + '</td><td>' + (r.notas || '') + '</td><td>' + r.canal + '</td>';
            tbody.appendChild(tr);
          });
        };
        tbl('tabla-llegadas', res.llegadas);
        tbl('tabla-salidas', res.salidas);
      })
      .withFailureHandler(manejarError)
      .llegadasYSalidas(SESION.token, fmtFecha(new Date()));
  }

  // ============================= Addons Glamping =============================
  function cargarAddons() {
    google.script.run
      .withSuccessHandler(function (lista) {
        var tbody = $('tabla-addons').querySelector('tbody'); tbody.innerHTML = '';
        lista.forEach(function (a) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td>' + a.huespedNombre + '</td><td>' + a.checkIn + '</td><td>' + (a.fechaHora || '') + '</td><td>' + a.estado + '</td><td></td>';
          var td = tr.lastElementChild;
          ['pendiente', 'coordinado', 'hecho'].forEach(function (e) {
            var b = document.createElement('button'); b.className = 'btn pequeno secundario'; b.textContent = e; b.style.marginRight = '4px';
            b.addEventListener('click', function () {
              google.script.run.withSuccessHandler(cargarAddons).withFailureHandler(manejarError)
                .actualizarEstadoAddon(SESION.token, a.id, e);
            });
            td.appendChild(b);
          });
          tbody.appendChild(tr);
        });
      })
      .withFailureHandler(manejarError)
      .listarAddons(SESION.token);
  }

  // ============================= Usuarios =============================
  function cargarUsuarios() {
    google.script.run
      .withSuccessHandler(function (lista) {
        var tbody = $('tabla-usuarios').querySelector('tbody'); tbody.innerHTML = '';
        lista.forEach(function (u) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td>' + u.nombre + '</td><td>' + etiquetaRol(u.rol) + '</td>';
          tbody.appendChild(tr);
        });
      })
      .withFailureHandler(manejarError)
      .listarUsuarios(SESION.token);
  }

  $('form-usuario').addEventListener('submit', function (e) {
    e.preventDefault();
    google.script.run
      .withSuccessHandler(function () { $('form-usuario').reset(); cargarUsuarios(); })
      .withFailureHandler(manejarError)
      .guardarUsuario(SESION.token, { nombre: val('us-nombre'), rol: val('us-rol'), pin: val('us-pin') });
  });
</script>
